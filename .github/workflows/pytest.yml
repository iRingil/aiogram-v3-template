name: Pytest

permissions:
  contents: read

on:
  push:
    branches: [ "master" ]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'pyproject.toml'
      - '.github/workflows/**'
  pull_request:
    branches: [ "master" ]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'pyproject.toml'
      - '.github/workflows/**'

jobs:
  test:
    runs-on: ubuntu-latest
    # Throwaway databases for the tests, with the credentials of the local WSL ones (tests/conftest.py)
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_user -d test_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8.4
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python 3.13
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      # The same ACL as the local test user: no dangerous commands, only database 15, FLUSHDB allowed
      - name: Create the Redis test user
        run: |
          docker exec ${{ job.services.redis.id }} redis-cli ACL SETUSER test_user on '>test_password' \
            '~*' '+@all' '-@dangerous' '-select' '+select|15' '+flushdb'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r src/requirements-dev.txt
      # --cov fails below 100% (fail_under in pyproject.toml)
      - name: Test with pytest
        run: |
          pytest tests --ignore=tests/integration --cov
