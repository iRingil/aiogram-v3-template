name: Pytest

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13"]
    # Throwaway databases for the tests, with the credentials of the local WSL ones (tests/conftest.py)
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_user -d test_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8.4
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      # The same ACL as the local test user: no dangerous commands, only database 15, FLUSHDB allowed
      - name: Create the Redis test user
        run: |
          docker exec ${{ job.services.redis.id }} redis-cli ACL SETUSER test_user on '>test_password' \
            '~*' '+@all' '-@dangerous' '-select' '+select|15' '+flushdb'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          cd src
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
      - name: Test with Pytest
        run: |
          pytest tests --ignore=tests/integration --cov
