# Nginx configuration to run the bot on the server in webhook mode

upstream tgbot {
    server 127.0.0.1:8080; # Replace with WEBAPP_HOST:WEBAPP_PORT from the .env file
}

server {
    listen 80;
    listen [::]:80;
    server_name server.com; # Replace server.com with your domain name

    server_tokens off;

    access_log /var/log/nginx/access-tgbot.log;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;

    location / { return 301 https://$server_name$request_uri; }

    return 444;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name server.com; # Replace server.com with your domain name

    root /usr/share/nginx/html/tgbot;

    ssl_certificate /etc/letsencrypt/live/server.com/fullchain.pem; # Replace server.com with your domain name
    ssl_certificate_key /etc/letsencrypt/live/server.com/privkey.pem; # Replace server.com with your domain name
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    server_tokens off;

    access_log /var/log/nginx/access-tgbot.log;

    add_header Strict-Transport-Security "max-age=15768000; includeSubDomains; preload;" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    # Allow only Telegram networks
    allow 149.154.160.0/20;
    allow 91.108.4.0/22;
    allow 2001:67c:4e8::/48;
    allow 2001:b28:f23d::/48;
    deny all;

    # Only Telegram knows the secret token: every other request is dropped.
    # Replace WEBHOOK_TOKEN with its value from the .env file
    if ($http_x_telegram_bot_api_secret_token != "WEBHOOK_TOKEN") { return 444; }

    location = /favicon.ico { access_log off; log_not_found off; }

    location / { return 444; }

    location /tgbot { proxy_pass http://tgbot; }
}
